<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Missed-answer review tests</title>
  <style>
    body {
      max-width: 760px;
      margin: 32px auto;
      padding: 0 16px;
      color: #20213a;
      font: 16px/1.5 system-ui, sans-serif;
    }

    iframe {
      display: block;
      width: 100%;
      height: 760px;
      margin: 20px 0;
      border: 1px solid #d5d4e0;
    }

    .passed { color: #087443; }
    .failed { color: #b4233b; }
  </style>
</head>
<body>
  <h1>Missed-answer review tests</h1>
  <p id="status" role="status" aria-live="polite">Running browser tests…</p>
  <ol id="results"></ol>
  <iframe id="quiz" src="../index.html" title="Space quiz under test"></iframe>
  <script>
    const frame = document.querySelector("#quiz");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");
    const checks = [];
    const correctIndices = [1, 1, 1, 1, 2, 3, 0, 2, 1, 3];

    function check(name, passed) {
      checks.push({ name, passed: Boolean(passed) });
    }

    function finishQuiz(doc, missedQuestions) {
      correctIndices.forEach((correctIndex, question) => {
        const answerIndex = missedQuestions.includes(question) ? 0 : correctIndex;
        doc.querySelector(`.answer[data-index="${answerIndex}"]`).click();
        if (question < correctIndices.length - 1) doc.querySelector("#next").click();
      });
      doc.querySelector("#next").click();
    }

    function renderResults() {
      results.innerHTML = checks.map(({ name, passed }) =>
        `<li class="${passed ? "passed" : "failed"}">${passed ? "PASS" : "FAIL"}: ${name}</li>`
      ).join("");
      const failures = checks.filter(({ passed }) => !passed).length;
      status.textContent = failures ? `${failures} test(s) failed.` : `All ${checks.length} tests passed.`;
      status.className = failures ? "failed" : "passed";
    }

    frame.addEventListener("load", () => {
      try {
        const doc = frame.contentDocument;
        finishQuiz(doc, [0, 5]);
        const review = doc.querySelector(".missed-review");
        const items = [...(review?.querySelectorAll("li") ?? [])];
        check("shows one review item for each missed answer", items.length === 2);
        check(
          "shows the selected answer, correct answer, and fact",
          items[0]?.textContent.includes("Your answer: Jupiter") &&
            items[0]?.textContent.includes("Correct answer: Saturn") &&
            items[0]?.textContent.includes("Saturn leads the solar system")
        );
        check(
          "uses a labelled section and ordered list",
          review?.getAttribute("aria-labelledby") === review.querySelector("h2")?.id &&
            Boolean(review.querySelector("ol"))
        );
        check("moves focus to the review heading", doc.activeElement?.id === "missed-review-title");

        doc.querySelector("#restart").click();
        finishQuiz(doc, []);
        check("omits the review when every answer is correct", !doc.querySelector(".missed-review"));
        check("clears missed answers on restart", doc.querySelector(".final-score")?.textContent.includes("10"));
        check("moves focus to the restart button for a perfect score", doc.activeElement?.id === "restart");
      } catch (error) {
        check(`test execution completed (${error.message})`, false);
      }
      renderResults();
    }, { once: true });
  </script>
</body>
</html>
