<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101326">
  <title>Orbit — Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: dark light;
      --page: #101326;
      --panel: #191d35;
      --panel-raised: #202541;
      --text: #f7f6ff;
      --muted: #a4a8c0;
      --line: #343954;
      --accent: #a99bff;
      --accent-strong: #8170f4;
      --success: #48d6a0;
      --success-bg: #173a35;
      --error: #ff7189;
      --error-bg: #422533;
      --hud-grid: rgb(169 155 255 / 4%);
      --hud-tick: rgb(14 16 31 / 65%);
      --star-color: rgb(207 200 255 / 68%);
      --shadow: 0 24px 80px rgb(3 5 20 / 35%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --page: #f4f3fc;
        --panel: #fff;
        --panel-raised: #f7f6ff;
        --text: #20213a;
        --muted: #71758f;
        --line: #e6e5f1;
        --accent: #6b59e8;
        --accent-strong: #5846d6;
        --success: #13875e;
        --success-bg: #e1f8ef;
        --error: #c93454;
        --error-bg: #fff0f2;
        --hud-grid: rgb(107 89 232 / 4%);
        --hud-tick: rgb(107 89 232 / 22%);
        --star-color: rgb(94 78 196 / 32%);
        --shadow: 0 24px 80px rgb(55 47 103 / 12%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      isolation: isolate;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 0%, rgb(125 107 241 / 18%), transparent 48%),
        var(--page);
      font-size: 15px;
      line-height: 1.55;
      transition: background-color 200ms ease, color 200ms ease;
    }

    body::before, body::after {
      position: fixed;
      z-index: -1;
      inset: -1%;
      content: "";
      background-repeat: no-repeat;
      pointer-events: none;
    }

    body::before {
      opacity: .58;
      background-image:
        radial-gradient(1px 1px at 8% 18%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1px 1px at 18% 72%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 28% 38%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1px 1px at 41% 84%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1px 1px at 53% 14%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 67% 63%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1px 1px at 76% 27%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1px 1px at 89% 78%, var(--star-color) 50%, transparent 100%);
      animation: star-drift 100s ease-in-out infinite alternate;
    }

    body::after {
      opacity: .34;
      background-image:
        radial-gradient(1px 1px at 14% 48%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 35% 22%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1px 1px at 61% 89%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1px 1px at 83% 44%, var(--star-color) 50%, transparent 100%),
        radial-gradient(1px 1px at 95% 11%, var(--star-color) 50%, transparent 100%);
      animation: star-twinkle 8s ease-in-out infinite alternate;
    }

    .quiz-shell { width: min(100%, 520px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgb(169 155 255 / 35%);
      border-radius: 10px;
      color: var(--accent);
      background: rgb(169 155 255 / 10%);
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background-color: var(--panel);
      background-image:
        linear-gradient(var(--hud-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--hud-grid) 1px, transparent 1px),
        radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 62%);
      background-size: 28px 28px, 28px 28px, auto;
      box-shadow: var(--shadow);
    }

    .card-top {
      padding: 20px 30px 18px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 87%, transparent);
    }

    .control-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .14em;
    }

    .control-kicker { color: var(--accent); }
    .control-divider { padding: 0 5px; color: var(--muted); }

    .signal {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--success);
      letter-spacing: .11em;
    }

    .signal-light {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 9px color-mix(in srgb, currentColor 65%, transparent);
      animation: signal-pulse 2.2s ease-in-out infinite;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .step-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .step-label strong {
      padding-left: 5px;
      color: var(--text);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }

    .step-total { color: var(--muted); }

    .score-pill {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 115px;
      padding: 7px 10px;
      border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--line));
      border-radius: 11px;
      background: color-mix(in srgb, var(--accent) 6%, var(--panel));
    }

    .score-icon { color: var(--accent); font-size: 12px; }

    .score-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .score-value {
      flex: 1;
      min-width: 1.2em;
      color: var(--text);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      text-align: right;
    }

    .progress-track {
      position: relative;
      height: 9px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--panel-raised);
    }

    .progress-ticks {
      position: absolute;
      z-index: 1;
      inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - 1px), var(--hud-tick) calc(10% - 1px), var(--hud-tick) 10%);
      pointer-events: none;
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent-strong), var(--accent));
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 65%, transparent);
      transition: width 420ms cubic-bezier(.2,.8,.2,1);
    }

    .question-content { padding: 30px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 5vw, 29px);
      line-height: 1.22;
      letter-spacing: -.035em;
    }

    .hint {
      margin: 9px 0 23px;
      color: var(--muted);
      font-size: 14px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      background: var(--panel-raised);
      font: inherit;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .answer:focus-visible, .primary-button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-key {
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      transition: inherit;
    }

    .answer.correct {
      border-color: var(--success);
      color: var(--text);
      background: var(--success-bg);
      animation: pop-in 300ms ease both;
    }

    .answer.correct .answer-key {
      border-color: transparent;
      color: var(--success);
      background: rgb(72 214 160 / 13%);
    }

    .answer.wrong {
      border-color: var(--error);
      background: var(--error-bg);
      animation: shake 380ms ease both;
    }

    .answer.wrong .answer-key {
      border-color: transparent;
      color: var(--error);
      background: rgb(255 113 137 / 12%);
    }

    .answer.reveal-correct {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .answer.reveal-correct .answer-key {
      color: var(--success);
      border-color: transparent;
    }

    .feedback {
      min-height: 28px;
      margin-top: 15px;
      color: var(--muted);
      font-size: 14px;
    }

    .feedback.is-correct { color: var(--success); }
    .feedback.is-wrong { color: var(--error); }

    .card-footer {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 30px;
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel-raised) 55%, transparent);
    }

    .footer-note {
      color: var(--muted);
      font-size: 13px;
    }

    .primary-button {
      min-height: 46px;
      padding: 0 19px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: var(--accent-strong);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .primary-button:hover { transform: translateY(-1px); filter: brightness(1.09); }
    .primary-button:active { transform: translateY(0); }

    .result-screen {
      padding: 42px 32px 36px;
      text-align: center;
      animation: rise-in 450ms ease both;
    }

    .result-emoji {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel-raised);
      font-size: 47px;
      animation: float 2.8s ease-in-out infinite;
    }

    .result-screen h1 { margin-bottom: 9px; }
    .result-description {
      max-width: 350px;
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 15px;
    }

    .final-score {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      margin: 1px 0 25px;
      color: var(--accent);
      font-size: 35px;
      font-weight: 800;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
    }

    .final-score span {
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .result-screen .primary-button { display: block; margin: auto; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @keyframes shake {
      15%, 55%, 85% { transform: translateX(-5px); }
      35%, 70% { transform: translateX(5px); }
      100% { transform: translateX(0); }
    }
    @keyframes signal-pulse {
      50% { opacity: .48; }
    }
    @keyframes star-drift {
      to { transform: translate3d(.5%, .4%, 0); }
    }
    @keyframes star-twinkle {
      to { opacity: .58; }
    }
    @keyframes pop-in {
      0% { transform: scale(.98); }
      55% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-5px) rotate(2deg); }
    }

    @media (max-width: 480px) {
      body { padding: 26px 14px; }
      .brand { margin-bottom: 19px; }
      .card { border-radius: 20px; }
      .card-top { padding: 18px 20px 16px; }
      .question-content { padding: 24px 20px; }
      .card-footer { padding: 14px 20px; }
      .result-screen { padding: 34px 22px 28px; }
      .footer-note { max-width: 150px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      body::before, body::after { animation: none; }
    }
  </style>
</head>
<body>
  <main class="quiz-shell">
    <div class="brand" aria-label="Orbit space quiz">
      <span class="brand-mark" aria-hidden="true">✦</span>
      Orbit <span aria-hidden="true">·</span> Space quiz
    </div>
    <section class="card" id="quiz" aria-label="Space exploration quiz">
      <div id="quiz-content"></div>
    </section>
  </main>

  <script>
    const questions = [
      {
        category: "The solar system",
        question: "Which planet has the most moons?",
        answers: ["Jupiter", "Saturn", "Neptune", "Uranus"],
        correct: 1,
        fact: "Saturn leads the solar system, with more than 140 confirmed moons."
      },
      {
        category: "Space history",
        question: "What was the first human-made object to reach space?",
        answers: ["Sputnik 1", "V-2 rocket", "Explorer 1", "Vostok 1"],
        correct: 1,
        fact: "A German V-2 rocket crossed the 100 km Kármán line in 1944."
      },
      {
        category: "Our moon",
        question: "About how long does sunlight take to reach Earth from the Sun?",
        answers: ["8 seconds", "8 minutes", "80 minutes", "8 hours"],
        correct: 1,
        fact: "Sunlight travels about 150 million km to Earth in roughly 8 minutes and 20 seconds."
      },
      {
        category: "Deep space",
        question: "Which spacecraft was the first to enter interstellar space?",
        answers: ["Pioneer 10", "Voyager 1", "New Horizons", "Voyager 2"],
        correct: 1,
        fact: "Voyager 1 crossed the heliopause in 2012, carrying the Golden Record."
      },
      {
        category: "The solar system",
        question: "Which planet is home to Olympus Mons, the largest volcano known?",
        answers: ["Venus", "Earth", "Mars", "Mercury"],
        correct: 2,
        fact: "Olympus Mons rises about 22 km above Mars's surface—nearly three times Everest's height."
      },
      {
        category: "Space history",
        question: "Who was the first person to walk on the Moon?",
        answers: ["Buzz Aldrin", "Yuri Gagarin", "Michael Collins", "Neil Armstrong"],
        correct: 3,
        fact: "Neil Armstrong stepped onto the lunar surface on July 20, 1969."
      },
      {
        category: "Beyond Earth",
        question: "What is the name of the galaxy closest in size to the Milky Way?",
        answers: ["Andromeda", "Triangulum", "Whirlpool", "Sombrero"],
        correct: 0,
        fact: "The Andromeda Galaxy is about 2.5 million light-years away—and approaching us."
      },
      {
        category: "Space science",
        question: "What does a light-year measure?",
        answers: ["Time", "Brightness", "Distance", "Speed"],
        correct: 2,
        fact: "A light-year is the distance light travels in one year: about 9.46 trillion km."
      },
      {
        category: "The solar system",
        question: "Which planet has a day longer than its year?",
        answers: ["Mercury", "Venus", "Mars", "Neptune"],
        correct: 1,
        fact: "Venus takes 243 Earth days to rotate once, but only 225 days to orbit the Sun."
      },
      {
        category: "Space exploration",
        question: "What is the name of NASA's next-generation space telescope launched in 2021?",
        answers: ["Hubble", "Kepler", "Chandra", "James Webb"],
        correct: 3,
        fact: "The James Webb Space Telescope observes the universe in infrared light."
      }
    ];

    const content = document.querySelector("#quiz-content");
    const quiz = document.querySelector("#quiz");
    let questionIndex = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const current = questions[questionIndex];
      const progress = ((questionIndex + 1) / questions.length) * 100;
      content.innerHTML = `
        <div class="card-top">
          <div class="control-heading">
            <span class="control-kicker">MISSION CONTROL <span class="control-divider">/</span> FLIGHT DECK</span>
            <span class="signal" aria-hidden="true"><span class="signal-light"></span> LIVE</span>
          </div>
          <div class="status-row">
            <div class="step-label">Question <strong>${String(questionIndex + 1).padStart(2, "0")}</strong><span class="step-total"> / ${String(questions.length).padStart(2, "0")}</span></div>
            <div class="score-pill" aria-label="Score ${score}">
              <span class="score-icon" aria-hidden="true">✦</span>
              <span class="score-label">Score</span>
              <strong class="score-value" id="score">${score}</strong>
            </div>
          </div>
          <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="${questions.length}" aria-valuenow="${questionIndex + 1}" aria-valuetext="Question ${questionIndex + 1} of ${questions.length}">
            <div class="progress-fill" style="width: ${progress}%"></div>
            <span class="progress-ticks" aria-hidden="true"></span>
          </div>
        </div>
        <div class="question-content">
          <p class="eyebrow">${current.category}</p>
          <h1 id="question-title">${current.question}</h1>
          <p class="hint">Choose the best answer to continue.</p>
          <div class="answers" role="group" aria-labelledby="question-title">
            ${current.answers.map((answer, index) => `
              <button class="answer" type="button" data-index="${index}">
                <span class="answer-key" aria-hidden="true">${String.fromCharCode(65 + index)}</span>
                <span>${answer}</span>
              </button>
            `).join("")}
          </div>
          <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        </div>
        <div class="card-footer">
          <span class="footer-note">A little closer to the stars.</span>
          <button class="primary-button" id="next" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
        </div>
      `;
      content.querySelectorAll(".answer").forEach(button => button.addEventListener("click", chooseAnswer));
      content.querySelector("#next").addEventListener("click", nextQuestion);
    }

    function chooseAnswer(event) {
      if (answered) return;
      answered = true;
      const selected = Number(event.currentTarget.dataset.index);
      const current = questions[questionIndex];
      const buttons = [...content.querySelectorAll(".answer")];
      const feedback = content.querySelector("#feedback");

      buttons.forEach(button => { button.disabled = true; });
      if (selected === current.correct) {
        score++;
        event.currentTarget.classList.add("correct");
        feedback.textContent = `Brilliant! ${current.fact}`;
        feedback.classList.add("is-correct");
        content.querySelector("#score").textContent = score;
        content.querySelector(".score-pill").setAttribute("aria-label", `Score ${score}`);
      } else {
        event.currentTarget.classList.add("wrong");
        buttons[current.correct].classList.add("reveal-correct");
        feedback.textContent = `Not quite. ${current.fact}`;
        feedback.classList.add("is-wrong");
      }
      const next = content.querySelector("#next");
      next.hidden = false;
      next.innerHTML = questionIndex === questions.length - 1
        ? 'See your results <span aria-hidden="true">→</span>'
        : 'Next question <span aria-hidden="true">→</span>';
      next.focus();
    }

    function nextQuestion() {
      if (questionIndex < questions.length - 1) {
        questionIndex++;
        answered = false;
        renderQuestion();
        content.querySelector(".answer").focus();
      } else {
        renderResults();
      }
    }

    function renderResults() {
      const result = score === 10
        ? { emoji: "🏆", title: "Out of this world!", description: "A perfect mission. The cosmos has no secrets from you." }
        : score >= 7
          ? { emoji: "🚀", title: "Stellar work!", description: "You're a true space explorer. Keep reaching for the stars." }
          : score >= 4
            ? { emoji: "🪐", title: "Nice orbit!", description: "You've got a great start. There's a whole universe left to discover." }
            : { emoji: "🌙", title: "Space cadet!", description: "Every great explorer starts somewhere. Ready for another mission?" };

      content.innerHTML = `
        <div class="result-screen">
          <div class="result-emoji" aria-hidden="true">${result.emoji}</div>
          <p class="eyebrow">Mission complete</p>
          <h1>${result.title}</h1>
          <p class="result-description">${result.description}</p>
          <div class="final-score" aria-label="${score} out of 10 correct">${score}<span>/ 10 correct</span></div>
          <button class="primary-button" id="restart" type="button">Explore again <span aria-hidden="true">↻</span></button>
        </div>
      `;
      content.querySelector("#restart").addEventListener("click", restart);
      content.querySelector("#restart").focus();
    }

    function restart() {
      questionIndex = 0;
      score = 0;
      answered = false;
      renderQuestion();
      content.querySelector(".answer").focus();
    }

    renderQuestion();
  </script>
</body>
</html>
